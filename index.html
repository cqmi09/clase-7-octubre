<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura de Datos</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
      --warning-hover: #d97706;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    input[type="text"],
    input[type="number"] {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text);
      transition: all 0.2s ease;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px);
    }

    #btnRegistrar { background-color: var(--primary); color: white; }
    #btnRegistrar:not(:disabled):hover { background-color: var(--primary-hover); }

    #btnConsultar { background-color: #0ea5e9; color: white; }
    #btnConsultar:not(:disabled):hover { background-color: #0284c7; }

    #btnModificar { background-color: var(--warning); color: white; }
    #btnModificar:not(:disabled):hover { background-color: var(--warning-hover); }

    #btnEliminar { background-color: var(--danger); color: white; }
    #btnEliminar:not(:disabled):hover { background-color: var(--danger-hover); }

    #btnCerrar { background-color: #64748b; color: white; margin-bottom: 15px; }
    #btnCerrar:hover { background-color: #475569; }

    #estado {
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 15px;
      color: var(--primary);
    }

    #seccionTabla {
      display: none;
    }

    .table-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }

    #buscador {
      width: 100%;
      max-width: 300px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #f1f5f9;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      border-top: 1px solid var(--border);
    }

    tbody tr {
      transition: background-color 0.15s ease;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    td button {
      padding: 6px 12px;
      font-size: 0.8rem;
      margin-right: 6px;
    }

    td button:first-child {
      background-color: var(--warning);
      color: white;
    }
    td button:first-child:hover { background-color: var(--warning-hover); }

    td button:last-child {
      background-color: var(--danger);
      color: white;
    }
    td button:last-child:hover { background-color: var(--danger-hover); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>Captura de Datos</h2>

      <form id="formulario">
        <input type="hidden" id="id">

        <div class="form-grid">
          <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>
          </div>

          <div class="form-group">
            <label for="edad">Edad:</label>
            <input type="number" id="edad" required min="1" max="120">
          </div>

          <div class="form-group">
            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" required>
          </div>

          <div class="form-group">
            <label for="nacionalidad">Nacionalidad:</label>
            <input type="text" id="nacionalidad" required>
          </div>

          <div class="form-group">
            <label for="salario">Salario:</label>
            <input type="text" id="salario" required>
          </div>
        </div>

        <div class="btn-container">
          <button type="button" id="btnRegistrar">Registrar</button>
          <button type="button" id="btnConsultar">Consultar</button>
          <button type="button" id="btnModificar">Modificar</button>
          <button type="button" id="btnEliminar">Eliminar</button>
        </div>
      </form>

      <p id="estado"></p>
    </div>

    <div id="seccionTabla" class="card">
      <div class="table-header-flex">
        <h2>Registros</h2>
        <input type="text" id="buscador" placeholder="Buscar por nombre...">
      </div>
      
      <button type="button" id="btnCerrar">Cerrar tabla</button>
      
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Nombre</th>
              <th>Edad</th>
              <th>Cargo</th>
              <th>Nacionalidad</th>
              <th>Salario</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzqAtXFOkDgRzydQ0zE111EZUr2-apyAQGL-QM4KFxz88abniSjHNgjCf7ytth3kf6Q4A/exec";
    var registros = [];
    var tablaVisible = false;

    // Enviar datos al script 
    function enviar(datos) {
      return fetch(URL_SCRIPT, {
        method: "POST",
        body: new URLSearchParams(datos)
      }).then(function (r) { return r.json(); });
    }

    // Botones activos según el estado 
    function actualizarBotones() {
      var hayRegistro = document.getElementById("id").value !== "";
      document.getElementById("btnRegistrar").disabled = hayRegistro;
      document.getElementById("btnModificar").disabled = !hayRegistro;
      document.getElementById("btnEliminar").disabled = !hayRegistro;
    }

    function limpiarFormulario() {
      document.getElementById("formulario").reset();
      document.getElementById("id").value = "";
      actualizarBotones();
    }

    // funcion REGISTRAR 
    document.getElementById("btnRegistrar").onclick = function () {
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Guardando...";
      enviar({
        accion: "guardar",
        nombre: document.getElementById("nombre").value,
        edad: document.getElementById("edad").value,
        cargo: document.getElementById("cargo").value,
        nacionalidad: document.getElementById("nacionalidad").value,
        salario: document.getElementById("salario").value
      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro guardado!");
      });
    };

    // funcion de CONSULTAR 
    document.getElementById("btnConsultar").onclick = function () {
      document.getElementById("estado").textContent = "Consultando...";
      tablaVisible = true;
      document.getElementById("seccionTabla").style.display = "block";
      cargarRegistros(function () {
        document.getElementById("estado").textContent = "";
      }); 
    };

    function cargarRegistros(alTerminar) {
      fetch(URL_SCRIPT)
        .then(function (r) { return r.json(); })
        .then(function (datos) {
          registros = datos;
          mostrarTabla();
          if (alTerminar) alTerminar();
        });
    }

    function mostrarTabla() {
      var filtro = document.getElementById("buscador").value.trim().toLowerCase();
      var tabla = document.getElementById("tabla");
      tabla.innerHTML = "";

      registros.forEach(function (reg) {
        if (!reg.nombre.toString().toLowerCase().startsWith(filtro)) return;

        var tr = document.createElement("tr");
        agregarCelda(tr, new Date(reg.fecha).toLocaleString());

        agregarCelda(tr, reg.nombre);
        agregarCelda(tr, reg.edad);
        agregarCelda(tr, reg.cargo);
        agregarCelda(tr, reg.nacionalidad);
        agregarCelda(tr, reg.salario);

        var td = document.createElement("td");

        var btnModificarFila = document.createElement("button");
        btnModificarFila.textContent = "Editar";
        btnModificarFila.onclick = function () { cargarEnFormulario(reg); };

        var btnEliminarFila = document.createElement("button");
        btnEliminarFila.textContent = "Eliminar";
        btnEliminarFila.onclick = function () { eliminar(reg.id); };

        td.appendChild(btnModificarFila);
        td.appendChild(btnEliminarFila);
        tr.appendChild(td);
        tabla.appendChild(tr);
      });
    }

    function agregarCelda(fila, texto) {
      var td = document.createElement("td");
      td.textContent = texto;
      fila.appendChild(td);
    }

    document.getElementById("buscador").oninput = mostrarTabla;

    // CERRAR TABLA 
    document.getElementById("btnCerrar").onclick = function () {
      tablaVisible = false;
      document.getElementById("seccionTabla").style.display = "none";
      document.getElementById("buscador").value = "";
      document.getElementById("tabla").innerHTML = "";
    };

    // ---------- Pasar el registro al formulario ----------
    function cargarEnFormulario(reg) {
      document.getElementById("id").value = reg.id;
      document.getElementById("nombre").value = reg.nombre;
      document.getElementById("edad").value = reg.edad;
      document.getElementById("cargo").value = reg.cargo;
      document.getElementById("nacionalidad").value = reg.nacionalidad;
      document.getElementById("salario").value = reg.salario;

      document.getElementById("estado").textContent =
        "Modificando registro: cambia los datos y presiona Modificar";
      actualizarBotones();

      window.scrollTo(0, 0);                 
      document.getElementById("nombre").focus(); 
    }

    // ---------- MODIFICAR ----------
    document.getElementById("btnModificar").onclick = function () {
      var id = document.getElementById("id").value;

      if (id === "") {
        alert("Primero elige un registro con el botón 'Editar'");
        return;
      }
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Modificando...";
      enviar({
        accion: "editar",
        id: id,
        nombre: document.getElementById("nombre").value,
        edad: document.getElementById("edad").value,
        cargo: document.getElementById("cargo").value,
        nacionalidad: document.getElementById("nacionalidad").value,
        salario: document.getElementById("salario").value,
      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro modificado!");
      });
    };

    // Funcion para ELIMINAR 
    document.getElementById("btnEliminar").onclick = function () {
      eliminar(document.getElementById("id").value);
    };

    function eliminar(id) {
      if (!confirm("¿Seguro que quieres eliminar este registro?")) return;

      document.getElementById("estado").textContent = "Eliminando...";
      enviar({ accion: "eliminar", id: id }).then(function (respuesta) {
        terminarAccion(respuesta, "Registro eliminado");
      });
    }

    // Mensaje al terminar cualquier acción 
    function terminarAccion(respuesta, mensajeOk) {
      document.getElementById("estado").textContent =
        respuesta.ok ? mensajeOk : "Error: " + respuesta.mensaje;
      limpiarFormulario();
      if (tablaVisible) cargarRegistros();  
    }

    actualizarBotones();
  </script>

</body>
</html>
